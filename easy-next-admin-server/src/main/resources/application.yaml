# 公共基线配置：只放所有环境共享的默认行为。
# 本地开发差异放 application-local.yaml，生产/内网/公网部署统一使用 application-prod.yaml 覆盖。
server:
  # 端口号
  port: 8080
  # 开启 HTTP 压缩可以减少网络传输的数据量，提高性能
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
  # tomcat配置
  tomcat:
    # 嵌入式 Tomcat 服务器运行时各类文件的存储根目录。Tomcat 服务器在运行期间会产生一些临时文件、日志文件等，basedir 就为这些文件提供了存储位置。
    basedir: ./
    # 允许最大连接数,默认8192,当达到临界值时,系统会基于accept-count继续接受连接 参数是客户感知型参数。
    max-connections: 8192
    # 当所有线程都在使用时,建立连接的请求的等待队列长度,默认100 请求的backlog值 如果超过max-connections和accept-count总和，新的连接会被拒绝，即直接拒绝服务（直接返回connection refused）
    accept-count: 100
    # 连接器在关闭空闲连接之前等待的毫秒数，默认 20000 20s
    connection-timeout: 20s
    uri-encoding: UTF-8
    threads:
      # 线程池的最小工作线程数,默认10
      min-spare: 10
      # 线程池的最大线程数,默认200
      max: 200
      # 线程池的最大空闲时间,默认60s
  servlet:
    context-path: /
spring:
  application:
    name: easy-next-admin
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  autoconfigure:
    # Redis / Kafka 都走 easy.features.* 能力级开关，避免依赖在 classpath 中时被 Spring Boot 默认自动装配。
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    # 公共配置不写真实账号密码；local/prod profile 负责提供环境值。
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    url: '${MYSQL_URL:}'
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  task:
    execution:
      pool:
        max-size: 10
        queue-capacity: 1
        allow-core-thread-timeout: true
        core-size: 5
        keep-alive: 60s
      thread-name-prefix: easy-config-
    scheduling:
      pool:
        size: 10
      thread-name-prefix: easy-schedule-
  freemarker:
    suffix: .ftl
  servlet:
    multipart:
      max-file-size: 20MB
  flyway:
    enabled: true
    # 历史表
    baselineOnMigrate: true
    validateOnMigrate: true
    # flyway的sql脚本路径
    locations: classpath:db/migration
  cloud:
    openfeign:
      micrometer: # 开启监控
        enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
            dismiss404: false
            # Feign使用默认的超时配置，在该类源码中可见，默认单次请求最大时长1秒，重试5次
            retryer: feign.Retryer.Default
      circuitbreaker:
        enabled: true
        group: # 使用 feign的注解的name找配置。默认是类名方法名 建议开启
          enabled: true
      httpclient:
        hc5:
          enabled: true
          connection-request-timeout: 3
          socket-timeout: 5
        max-connections: 200
        max-connections-per-route: 50
    discovery:
      enabled: false
mybatis-plus:
  # 配置日志 #仅控制台输出的日志
  #  configuration:
  #  log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    # 是否开启print logo
    banner: false
easy:
  log-file-path: ${EASY_LOG_FILE_PATH:logs/easy-next-admin.log}
  observability:
    # Keep the reusable starter aligned with the application's existing monitoring switch.
    enabled: ${easy.features.monitor:true}
    trace:
      # Keep annotated spans aligned with the application's existing trace switch.
      enabled: ${easy.trace.enabled:true}
      # The async-aware MVC interceptor owns HTTP entry traces in Easy Admin.
      http-server-observation-enabled: false
      # MyBatis and Redisson native adapters own these operations in Easy Admin.
      redis-observation-enabled: false
      database-observation-enabled: false
      # Starter keeps reusable Slow/Error operation history separately from app-specific JFR/thread diagnostics.
      history-file: ${EASY_OBSERVABILITY_INCIDENT_FILE:./data/easy-observability/incidents.jsonl}
      archive-file: ${EASY_OBSERVABILITY_TRACE_FILE:./data/easy-observability/traces.jsonl}
    transaction:
      # The starter owns transaction timing and trace capture; the server adds local JFR diagnostics only.
      slow-threshold-ms: ${EASY_TRACE_TRANSACTION_SLOW_THRESHOLD_MS:1000}
    metrics:
      history:
        enabled: ${easy.monitor.diagnosis.enabled:true}
        # Keep the legacy directory as the default so existing RRD4J history survives the module move.
        storage-dir: ${EASY_DIAGNOSIS_METRICS_STORAGE_DIR:./data/diagnosis/metrics}
        retention-days: ${EASY_DIAGNOSIS_METRICS_RETENTION_DAYS:15}
        interval-ms: ${EASY_DIAGNOSIS_METRICS_PERSIST_INTERVAL_MS:60000}
        max-storage-bytes: ${EASY_DIAGNOSIS_METRICS_HISTORY_MAX_BYTES:67108864}
        max-series-bytes: ${EASY_DIAGNOSIS_METRICS_SEGMENT_MAX_BYTES:8388608}
        max-series: ${EASY_DIAGNOSIS_METRICS_MAX_SERIES:512}
  features:
    # 能力级开关集中在这里，避免 Redis/Kafka/OSS 等可选依赖被误装配。
    redis: ${EASY_FEATURE_REDIS:true}
    scheduler: ${EASY_FEATURE_SCHEDULER:true}
    outbox: ${EASY_FEATURE_OUTBOX:true}
    kafka: ${EASY_FEATURE_KAFKA:false}
    feign: ${EASY_FEATURE_FEIGN:true}
    oss: ${EASY_FEATURE_OSS:false}
    web-log: ${EASY_FEATURE_WEB_LOG:true}
    monitor: ${EASY_FEATURE_MONITOR:true}
  monitor:
    diagnosis:
      enabled: ${EASY_DIAGNOSIS_ENABLED:true}
      # JFR 是近期深度取证增强项；Metrics、Slow、Errors、关联 Trace 和单次资源统计不依赖它。
      jfr-enabled: ${EASY_DIAGNOSIS_JFR_ENABLED:false}
      detail-sampling-enabled: ${EASY_DIAGNOSIS_DETAIL_SAMPLING_ENABLED:true}
      # 活跃操作只保留固定上限；SQL 另设子上限，为 HTTP、Job、Kafka 等入口预留容量。
      active-max-entries: ${EASY_DIAGNOSIS_ACTIVE_MAX_ENTRIES:4096}
      active-max-sql-entries: ${EASY_DIAGNOSIS_ACTIVE_MAX_SQL_ENTRIES:1024}
      # 慢周期采样和慢/错结束采样共享深栈与完整持有锁预算；周期内超额时可能只有轻量现场。
      active-max-samples-per-cycle: ${EASY_DIAGNOSIS_ACTIVE_MAX_SAMPLES_PER_CYCLE:32}
      # SQL 默认只保留耗时，并在深采样预算内尝试保留慢/错线程栈与锁现场；逐条 CPU/分配/争用差值需显式开启。
      sql-resource-sampling-enabled: ${EASY_DIAGNOSIS_SQL_RESOURCE_SAMPLING_ENABLED:false}
      # 兼容旧版远程调用明细表；默认关闭，慢/错详情统一写有界本地 Incident JSONL。
      remote-log-persistence-enabled: ${EASY_DIAGNOSIS_REMOTE_LOG_PERSISTENCE_ENABLED:false}
      # 默认不读取首尾 ThreadInfo，blocked/waited 次数与耗时均不可用；慢/错现场另受深采样预算控制。按需开启会增加 JVM 全局争用统计开销。
      contention-time-enabled: ${EASY_DIAGNOSIS_CONTENTION_TIME_ENABLED:false}
      # 结构化诊断、Metrics 时序段和可选 JFR 分段写到本地；生产请将该目录挂到持久卷。
      storage-dir: ${EASY_DIAGNOSIS_STORAGE_DIR:./data/diagnosis}
      retention-days: ${EASY_DIAGNOSIS_RETENTION_DAYS:30}
      # 显式开启兼容表后每天物理清理，复用 retention-days，避免逻辑删除后表仍持续增长。
      remote-log-cleanup-cron: "${EASY_DIAGNOSIS_REMOTE_LOG_CLEANUP_CRON:0 29 2 * * *}"
      # Trace、事务、操作和事件使用稀疏 JSONL；Metrics 使用独立 RRD4J 时序文件，互不挤占容量。
      history-max-bytes: ${EASY_DIAGNOSIS_HISTORY_MAX_BYTES:67108864}
      history-segment-max-bytes: ${EASY_DIAGNOSIS_HISTORY_SEGMENT_MAX_BYTES:8388608}
      # 异步 JSONL 队列同时按条数和估算内存限流，避免慢盘时大量诊断对象滞留堆内存。
      pending-max-bytes: ${EASY_DIAGNOSIS_PENDING_MAX_BYTES:16777216}
      # 监控采样、RRD 写入和清理使用独立调度池，避免慢磁盘让 500ms 活跃操作采样失去时效。
      scheduler-pool-size: ${EASY_DIAGNOSIS_SCHEDULER_POOL_SIZE:2}
      # 显式开启兼容 MySQL 明细后才使用该异步队列；队列满时丢明细，不反压业务线程。
      persistence-queue-capacity: ${EASY_DIAGNOSIS_PERSISTENCE_QUEUE_CAPACITY:512}
      # 开启 JFR 后仅保留近期深度取证窗口，不承担 30 天趋势存储。
      jfr-retention-days: ${EASY_DIAGNOSIS_JFR_RETENTION_DAYS:1}
      # 页面开启的单次 JFR 会话最长 24 小时；录制采用 JDK continuous/default 低开销基线，重启后回到配置默认状态。
      jfr-max-session-minutes: ${EASY_DIAGNOSIS_JFR_MAX_SESSION_MINUTES:1440}
      jfr-session-check-ms: ${EASY_DIAGNOSIS_JFR_SESSION_CHECK_MS:60000}
      jfr-rotation-ms: ${EASY_DIAGNOSIS_JFR_ROTATION_MS:1800000}
      jfr-max-total-bytes: ${EASY_DIAGNOSIS_JFR_MAX_TOTAL_BYTES:67108864}
      jfr-max-file-bytes: ${EASY_DIAGNOSIS_JFR_MAX_FILE_BYTES:16777216}
      active-sample-interval-ms: ${EASY_DIAGNOSIS_ACTIVE_SAMPLE_INTERVAL_MS:500}
  assistant:
    trace:
      # 生产安全默认：不在 Trace 中记录 Prompt、Tool 参数和业务结果正文。
      content-mode: ${EASY_ASSISTANT_TRACE_CONTENT_MODE:METADATA_ONLY}
      max-payload-length: ${EASY_ASSISTANT_TRACE_MAX_PAYLOAD_LENGTH:16000}
    runtime:
      # 一次完整 Agent Turn 的 SSE 生命周期；独立于单次模型请求超时。
      stream-timeout: ${EASY_ASSISTANT_STREAM_TIMEOUT:3m}
      # SSE 注释心跳不会进入前端业务事件列表，只用于跨越网关/代理空闲超时。
      heartbeat-interval: ${EASY_ASSISTANT_HEARTBEAT_INTERVAL:15s}
      # 同一用户会话的分布式 Turn 锁租期；底层会自动续租，不限制完整 Agent 耗时。
      conversation-turn-lock-lease: ${EASY_ASSISTANT_TURN_LOCK_LEASE:30s}
      heartbeat-scheduler-pool-size: ${EASY_ASSISTANT_HEARTBEAT_THREADS:2}
      executor:
        # Agent 长耗时网络调用与普通 CRUD 线程池隔离，队列满时拒绝新任务而不是拖垮业务接口。
        core-size: ${EASY_ASSISTANT_EXECUTOR_CORE_SIZE:8}
        max-size: ${EASY_ASSISTANT_EXECUTOR_MAX_SIZE:32}
        queue-capacity: ${EASY_ASSISTANT_EXECUTOR_QUEUE_CAPACITY:32}
        await-termination-seconds: ${EASY_ASSISTANT_EXECUTOR_AWAIT_TERMINATION_SECONDS:60}
    model:
      # 助手统一通过 OpenAI-compatible Chat Completions 执行原生 Tool Calling 和最终回复。
      base-url: ${EASY_ASSISTANT_MODEL_BASE_URL:${AI_ASSISTANT_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}}
      completions-path: ${EASY_ASSISTANT_MODEL_COMPLETIONS_PATH:${AI_ASSISTANT_COMPLETIONS_PATH:/chat/completions}}
      api-key: '${EASY_ASSISTANT_MODEL_API_KEY:${AI_ASSISTANT_API_KEY:}}'
      model: ${EASY_ASSISTANT_MODEL_MODEL:${AI_ASSISTANT_MODEL:qwen-plus}}
      timeout: ${EASY_ASSISTANT_MODEL_TIMEOUT:${AI_ASSISTANT_TURN_TIMEOUT:20s}}
      temperature: ${EASY_ASSISTANT_MODEL_TEMPERATURE:0}
      max-tokens: ${EASY_ASSISTANT_MODEL_MAX_TOKENS:800}
      max-model-calls: ${EASY_ASSISTANT_MAX_MODEL_CALLS:6}
      max-tool-calls: ${EASY_ASSISTANT_MAX_TOOL_CALLS:6}
      # 允许模型读取 observation 后继续进行有界只读查询；1 表示保持单 Tool round。
      max-read-tool-rounds: ${EASY_ASSISTANT_MAX_READ_TOOL_ROUNDS:3}
      # 仅在 Provider 支持 response_format=json_schema 时开启；用户 API 的 reply 字段保持不变。
      structured-output-enabled: ${EASY_ASSISTANT_STRUCTURED_OUTPUT_ENABLED:false}
  spring:
    redis:
      database: ${EASY_REDIS_DATABASE:0}
      address: ${EASY_REDIS_ADDRESS:redis://localhost:6379}
      password: '${EASY_REDIS_PASSWORD:}'
      client-name: ${EASY_REDIS_CLIENT_NAME:easy-next-admin}
      dns-monitoring-interval: ${EASY_REDIS_DNS_MONITORING_INTERVAL:-1}
    kafka:
      bootstrap-servers: ${EASY_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      topic: ${EASY_KAFKA_TOPIC:easynext}
  auth:
    session:
      idle-timeout: ${EASY_AUTH_SESSION_IDLE_TIMEOUT:30m}
      absolute-timeout: ${EASY_AUTH_SESSION_ABSOLUTE_TIMEOUT:8h}
  # web防火墙配置
  waf:
    sql-enabled: false
    xss-enabled: false
    excludes: /flow/*
  web:
    cors:
      # 生产环境替换为真实前端域名；如需泛域名，使用 allowed-origin-patterns。
      allowed-origins:
        - http://localhost:5174
        - http://127.0.0.1:5174
        - http://localhost:5175
        - http://127.0.0.1:5175
        - http://localhost:5173
        - http://127.0.0.1:5173
      allowed-origin-patterns: []
      allowed-methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowed-headers:
        - '*'
      exposed-headers:
        - X-Trace-Id
      allow-credentials: true
      max-age-seconds: 3600
    security-headers:
      frame-options: SAMEORIGIN
      # CSP/HSTS 默认不强开，避免影响本地 HTTP 和历史内联资源；生产可按部署域名收紧。
      content-security-policy: ''
      hsts-enabled: false
      hsts: max-age=31536000; includeSubDomains
      referrer-policy: strict-origin-when-cross-origin
      permissions-policy: geolocation=(), microphone=(), camera=()
  storage:
    local:
      enable: true
      address: http://localhost:8080
      storage-path: storage
    aliyun:
      enable: false
  trace:
    enabled: true
    http-slow-threshold-ms: 3000
    max-depth: 64
    min-node-cost-ms: 1
    schedule-slow-threshold-ms: 10000
    kafka-consumer-slow-threshold-ms: 30000
    transaction-slow-threshold-ms: ${EASY_TRACE_TRANSACTION_SLOW_THRESHOLD_MS:1000}
    sql-slow-threshold-ms: ${EASY_TRACE_SQL_SLOW_THRESHOLD_MS:500}
    remote-slow-threshold-ms: ${EASY_TRACE_REMOTE_SLOW_THRESHOLD_MS:3000}
  thread-pool:
    scheduler:
      pool-size: ${EASY_JOB_POOL_SIZE:20}
      thread-name-prefix: easy-job-
      await-termination-seconds: 10
    business:
      core-size: ${EASY_BUSINESS_POOL_CORE_SIZE:20}
      max-size: ${EASY_BUSINESS_POOL_MAX_SIZE:100}
      queue-capacity: ${EASY_BUSINESS_POOL_QUEUE_CAPACITY:100}
      thread-name-prefix: easy-executor-
      await-termination-seconds: 60
    business-mdc:
      pool-size: ${EASY_BUSINESS_MDC_POOL_SIZE:20}
      queue-size: ${EASY_BUSINESS_MDC_QUEUE_SIZE:100}
      thread-name-prefix: business
    lock:
      pool-size: ${EASY_LOCK_POOL_SIZE:5}
      thread-name-prefix: easy-lock-
      await-termination-seconds: 60
# actuator
management:
  endpoint:
    info:
      enabled: true
    health:
      # 生产默认不暴露健康检查细节，local 环境再打开。
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: '*'
  health:
    redis:
      enabled: ${easy.features.redis:false}
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  influx:
    metrics:
      export:
        enabled: ${MANAGEMENT_INFLUX_METRICS_EXPORT_ENABLED:false}
        user-name: '${MANAGEMENT_INFLUX_METRICS_EXPORT_USERNAME:}'
        password: '${MANAGEMENT_INFLUX_METRICS_EXPORT_PASSWORD:}'
  endpoints:
    web:
      exposure:
        # Metrics 通过受 monitor:diagnosis:view 保护的诊断 API 查看，不裸露 Actuator 指标端点。
        include: health,info
  info:
    build:
      enabled: true
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    git:
      enabled: true
      mode: simple
info:
  # 环境变量
  java-vendor: ${java.specification.vendor}
  app:
    author: laker
    # 项目版本
    version: @project.version@
    name: easy-next-admin
# springdoc-openapi 项目配置。机器可读规范访问 /v3/api-docs，调试 UI 访问 /swagger-ui.html。
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: false
  api-docs:
    path: /v3/api-docs
    enabled: false
logging:
  level:
    org.springframework.web.client.RestTemplate: error

# 配置 Resilience4j CircuitBreaker
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 100
        permittedNumberOfCallsInHalfOpenState: 10
        waitDurationInOpenState: 10000
        failureRateThreshold: 60
        eventConsumerBufferSize: 10
        registerHealthIndicator: true
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
        ignoreExceptions:
          - java.lang.RuntimeException
  # 配置 Resilience4j RateLimiter
  timelimiter:
    configs:
      default:
        cancelRunningFuture: false
        timeoutDuration: 5s
